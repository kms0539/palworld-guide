<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="매일 갱신되는 팰월드 1.0 펠 추천, 역할별 도감, 빌드와 자원·보스 실지도 공략">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; upgrade-insecure-requests">
  <title>MS 팰월드 공략집</title>
  <link rel="stylesheet" href="./styles.css?v=1.15.0">
  <link rel="stylesheet" href="./components.css?v=1.15.0">
  <link rel="stylesheet" href="./progression.css?v=1.15.0">
  <link rel="stylesheet" href="./enhancements.css?v=1.15.0">
  <link rel="stylesheet" href="./map-markers.css?v=1.13.0">
  <script src="./app.js?v=1.14.4" type="module"></script>
</head>
<body>
  <main>
    <header class="topbar">
      <a class="brand" href="./" aria-label="공략집 첫 화면"><span>MS</span><strong>팰월드 공략집</strong></a>
      <div class="header-actions">
        <div id="freshness" class="freshness">자료 확인 중</div>
        <a class="repo-button" href="https://github.com/kms0539/palworld-guide" target="_blank" rel="noopener noreferrer">자료 저장소</a>
      </div>
    </header>

    <section class="hero">
      <div class="hero-copy">
        <p class="eyebrow">매일 갱신 · 팰월드 1.0</p>
        <h1>오늘 필요한 펠과<br>자원을 바로 찾으세요.</h1>
        <p>전투·거점·이동용 펠 추천부터 실제 지형 위 보스와 광석 위치까지 한글로 정리했습니다.</p>
        <div class="hero-links"><button type="button" data-jump="recommendations">추천 펠 보기</button><button type="button" data-jump="map">실제 지도 열기</button></div>
      </div>
      <dl id="metrics" aria-label="공략집 자료 현황"></dl>
    </section>

    <section id="freshness-panel" class="freshness-panel" aria-live="polite"></section>
    <nav id="tabs" aria-label="공략 메뉴">
      <button type="button" data-tab="recommendations" class="active">목적별 추천</button>
      <button type="button" data-tab="progression">성장 단계</button>
      <button type="button" data-tab="pals">펠 도감</button>
      <button type="button" data-tab="breeding">번식</button>
      <button type="button" data-tab="items">아이템·제작</button>
      <button type="button" data-tab="builds">추천 빌드</button>
      <button type="button" data-tab="traits">특성</button>
      <button type="button" data-tab="map">실제 지도</button>
      <button type="button" data-tab="tools">도구 모음</button>
    </nav>
    <section id="content" class="content"><div class="loading">공략 데이터를 불러오고 있습니다.</div></section>
    <details id="sources-panel" class="sources-panel">
      <summary>자료 출처와 이용 범위</summary>
      <div id="sources-body"></div>
    </details>
    <footer>
      <p>이 페이지는 비공식 팬 공략집입니다. Palworld 및 게임 자산의 권리는 Pocketpair에 있습니다. <a href="./THIRD_PARTY_NOTICES.txt">이미지 이용 안내</a></p>
      <p>홈 서버 상태·사용자·IP·비밀번호·Discord 설정은 공개하지 않습니다.</p>
    </footer>
  </main>
</body>
</html>
